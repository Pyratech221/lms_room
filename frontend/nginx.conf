server {
    listen 80;
    server_name _;

    # Redirections relatives : nginx écoute sur le port 80 du conteneur, mais Docker le publie
    # sur un autre port (8080) et Coolify le placera derrière un domaine. Une redirection absolue
    # perdrait ce port ou ce domaine (« /admin » renverrait vers http://localhost/admin/).
    absolute_redirect off;

    # Compression des réponses texte (le bundle JS pèse ~300 Ko).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API Django ---
    # Tout est servi sous le même domaine : le navigateur ne voit qu'une seule origine,
    # donc pas de CORS et des cookies de session en SameSite=Lax.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Admin Django et ses fichiers statiques (servis par WhiteNoise) ---
    # « /admin » sans slash tomberait sinon dans l'application React, qui redirigerait vers l'accueil.
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
    }

    # --- Application React ---
    location / {
        root /usr/share/nginx/html;
        # Les routes du SPA (/accueil, /administration…) n'existent pas sur le disque :
        # on renvoie index.html et React Router prend le relais.
        try_files $uri $uri/ /index.html;
    }

    # --- PWA ---
    # Le service worker et le manifeste ne portent pas de hash. Mis en cache, une version
    # périmée du worker continuerait à servir l'ancienne application sans jamais aller
    # chercher la nouvelle.
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Les assets buildés portent un hash dans leur nom : cache long sans risque.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
